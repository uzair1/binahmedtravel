
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password - Bin Ahmad Travel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="login-box">
    <h2>Bin Ahmad Travel</h2>
    <p style="text-align:center">Create a new administrator password</p>

    <form id="resetForm" hidden>
      <input
        type="password"
        id="newPassword"
        placeholder="New password"
        minlength="8"
        required
      >
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="8"
        required
      >
      <button type="submit">Update Password</button>
    </form>

    <p id="message">Verifying your recovery link...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <script>
    const client = window.supabaseClient;
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    let recoveryVerified = false;

    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryVerified = true;
        form.hidden = false;
        message.textContent = "Recovery verified. Enter your new password.";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryVerified) {
        message.textContent = "Please open a valid recovery link first.";
        return;
      }

      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent = "Updating password...";

      const { error } = await client.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Password updated successfully! You can now return to the admin login page.";

      form.hidden = true;
      recoveryVerified = false;

      await client.auth.signOut();
    });
  </script>

</body>
</html>
